name: Deploy film workshop to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: studio-source/package-lock.json
      - run: npm ci --prefix studio-source --no-audit --no-fund
      - run: npm run build --prefix studio-source
      - uses: actions/configure-pages@v5
      - name: Prepare site and select the media host
        env:
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          MEDIA_SCOPE: ${{ vars.MEDIA_SCOPE }}
        run: node scripts/prepare-pages.cjs "$RUNNER_TEMP/workshop-pages"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/workshop-pages
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
